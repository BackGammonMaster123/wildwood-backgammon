name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: No API keys in the repo
        run: "! git grep -nIE 'sk-ant-[A-Za-z0-9_-]{16,}' -- . ':!package-lock.json'"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Engine in page matches engine.js
        run: |
          cp backgammon.html /tmp/before.html
          node build-page.js
          diff -q /tmp/before.html backgammon.html || (echo "backgammon.html is stale: run npm run build" && exit 1)
      - run: npm test
